name: Run Telegram Bot

on:
  push:
    branches: [main]
    paths:
      - 'sciencenet_bot/**'
      - 'tests/**'
      - 'worm.py'
      - 'requirements*'
      - '.github/workflows/crawler.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify checks live access without sending; send delivers real articles'
        required: true
        type: choice
        default: verify
        options: [verify, send]

permissions:
  contents: read

concurrency:
  group: sciencenet-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests (no Telegram credentials)
        run: python -m unittest discover -s tests -v

  run:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt

      # Code pushes and manual checks NEVER send subscriber messages.
      - name: Verify live source and Telegram access without sending
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify')
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -m sciencenet_bot --dry-run --verify-telegram

      - name: Deliver real articles (at most five)
        id: deliver
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'send')
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -m sciencenet_bot --max-messages 5

      # Keep successful deliveries even if a later article failed to send.
      - name: Persist delivery checkpoints
        if: ${{ always() && (steps.deliver.outcome == 'success' || steps.deliver.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- previous_articles.json
          if git diff --cached --quiet; then
            echo "No delivery checkpoints changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update delivered article IDs [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep 2
          done
          echo 'Failed to persist delivery history.' >&2
          exit 1
